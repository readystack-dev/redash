[supervisord]
nodaemon=true
user=redash
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:server]
command=/opt/venv/bin/gunicorn -b [::]:5000 --name redash -w 4 redash.wsgi:app --max-requests 1000 --max-requests-jitter 100 --timeout 60 --limit-request-line 0
directory=/app
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:worker]
command=/opt/venv/bin/python /app/manage.py rq worker
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:scheduler]
command=/opt/venv/bin/python /app/manage.py rq scheduler
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
